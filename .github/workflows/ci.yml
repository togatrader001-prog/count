name: Count CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run endpoint tests
        run: npm run test:e2e

      - name: Build the app
        run: npm run build

      - name: Build the Docker image
        run: docker build -t count-app .

      - name: Sign in to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::864902168755:role/github-actions-count-ecr
          aws-region: us-east-2

      - name: Sign in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag count-app:latest 864902168755.dkr.ecr.us-east-2.amazonaws.com/count:${{ github.sha }}
          docker push 864902168755.dkr.ecr.us-east-2.amazonaws.com/count:${{ github.sha }}