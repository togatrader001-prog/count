name: Count CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run endpoint tests
        run: npm run test:e2e

      - name: Build the app
        run: npm run build

      - name: Build the Docker image
        run: docker build -t count-app .